<svg width="850" height="230" viewBox="0 0 850 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulse_border {
        0%, 100% { stroke: #222530; }
        50% { stroke: #ff003c; }
      }
      @keyframes kanji_glow {
        0%, 100% { fill: #ff003c; filter: drop-shadow(0 0 2px #ff003c); }
        50% { fill: #ff4770; filter: drop-shadow(0 0 8px #ff2a55); }
      }
      .card-border { animation: pulse_border 4s ease-in-out infinite; }
      .kanji-text { animation: kanji_glow 3s ease-in-out infinite; }
    </style>
    <linearGradient id="arch_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>
    <pattern id="arch_crt" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="4" y2="4" stroke="#141822" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Card Frame -->
  <rect x="2" y="2" width="846" height="226" rx="6" fill="url(#arch_bg)" stroke="#222530" stroke-width="1.2" class="card-border"/>
  <rect x="3" y="3" width="844" height="224" fill="url(#arch_crt)" opacity="0.4"/>

  <!-- Titlebar -->
  <rect x="3" y="3" width="844" height="24" rx="5" fill="#141824" stroke="#1f2430" stroke-width="0.8"/>
  <rect x="12" y="9" width="8" height="8" rx="1" fill="#ff003c"/>
  <text x="28" y="19" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#e6edf3" letter-spacing="1.5">SYS.ARCHITECT // EMIRHAN_ÜNAL [ PROFILE_MANIFEST ]</text>
  <text x="790" y="19" font-family="monospace" font-size="11" fill="#8b949e">[ _ ][ □ ][ X ]</text>

  <!-- Left Panel: Manga Quote & Identity Stamp -->
  <rect x="16" y="36" width="240" height="142" rx="4" fill="#07090e" stroke="#21262d" stroke-width="0.8"/>
  
  <text x="30" y="58" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#ff003c" letter-spacing="2">「 覚悟 • DISCIPLINE 」</text>
  <text x="30" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9" font-style="italic">"Code is the katana of the</text>
  <text x="30" y="94" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9" font-style="italic">digital realm — sharpened</text>
  <text x="30" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9" font-style="italic">by discipline, validated</text>
  <text x="30" y="126" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9" font-style="italic">by tests."</text>
  
  <rect x="28" y="142" width="216" height="24" rx="3" fill="#121622"/>
  <text x="36" y="158" font-family="'Consolas', monospace" font-size="9" font-weight="700" fill="#ff4770">OPERATOR: EMIRHAN ÜNAL</text>

  <!-- Right Panel: Core Specs & Philosophy -->
  <rect x="268" y="36" width="566" height="142" rx="4" fill="#07090e" stroke="#21262d" stroke-width="0.8"/>
  
  <text x="285" y="58" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#ff2a55">⚔️ SYSTEM ATTRIBUTES &amp; LEADERSHIP</text>
  
  <text x="285" y="80" font-family="'Consolas', monospace" font-size="10" fill="#8b949e">• INDUSTRY EXPERIENCE :</text>
  <text x="460" y="80" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#ffffff">6+ Years across Game Studios &amp; Simulation Labs</text>

  <text x="285" y="98" font-family="'Consolas', monospace" font-size="10" fill="#8b949e">• TEAM LEADERSHIP     :</text>
  <text x="460" y="98" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#ffffff">15+ Cross-Disciplinary Engineers &amp; Technical Artists</text>

  <text x="285" y="116" font-family="'Consolas', monospace" font-size="10" fill="#8b949e">• COMMUNITY NETWORK   :</text>
  <text x="460" y="116" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#ffffff">200+ Game Developers Founded &amp; Mentored</text>

  <text x="285" y="134" font-family="'Consolas', monospace" font-size="10" fill="#8b949e">• CORE SPECIALIZATION :</text>
  <text x="460" y="134" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#00ff66">Real-Time Multiplayer, 20Hz Netcode &amp; Physics</text>

  <text x="285" y="152" font-family="'Consolas', monospace" font-size="10" fill="#8b949e">• ENGINEERING MOTTO   :</text>
  <text x="460" y="152" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#ff4770">Decoupled architecture, deterministic state, zero fluff.</text>

  <!-- Bottom Terminal Status Bar -->
  <rect x="16" y="186" width="818" height="32" rx="3" fill="#090b10" stroke="#191d28" stroke-width="0.8"/>
  <text x="28" y="206" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#00ff66">> STATUS: ACTIVE ARCHITECT</text>
  <text x="240" y="206" font-family="'Consolas', monospace" font-size="10" fill="#8b949e">LOCATION: ISTANBUL / ESKİŞEHİR</text>
  <text x="510" y="206" font-family="'Consolas', monospace" font-size="10" fill="#8b949e">DEGREE: B.Sc. COMP ENG @ ESOGÜ</text>
  <text x="760" y="206" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#ff003c">ONLINE ●</text>
</svg>