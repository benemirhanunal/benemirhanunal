<svg width="850" height="380" viewBox="0 0 850 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { opacity: 0.28; }
        100% { transform: translateY(380px); opacity: 0.15; }
      }
      @keyframes glitch {
        0%, 100% { transform: translate(0, 0); opacity: 1; }
        92% { transform: translate(0, 0); opacity: 1; }
        93% { transform: translate(-2px, 1px); opacity: 0.85; }
        94% { transform: translate(2px, -1px); opacity: 0.9; }
        95% { transform: translate(0, 0); opacity: 1; }
      }
      @keyframes eye_pulse {
        0%, 100% { fill: #ff003c; filter: drop-shadow(0 0 6px #ff003c); opacity: 1; }
        50% { fill: #ffffff; filter: drop-shadow(0 0 12px #ff2a55); opacity: 0.9; }
      }
      @keyframes horn_glow {
        0%, 100% { stroke: #ff003c; filter: drop-shadow(0 0 4px #ff003c); }
        50% { stroke: #ff4770; filter: drop-shadow(0 0 10px #ff2a55); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulse_led {
        0%, 100% { fill: #00ff66; filter: drop-shadow(0 0 4px #00ff66); }
        50% { fill: #008833; filter: drop-shadow(0 0 1px #008833); }
      }
      @keyframes stream_flow {
        0% { stroke-dashoffset: 150; }
        100% { stroke-dashoffset: 0; }
      }
      .glitch-target { animation: glitch 4s infinite; }
      .eye-target { animation: eye_pulse 2.5s infinite ease-in-out; }
      .horn-target { animation: horn_glow 3s infinite ease-in-out; }
      .cursor-blink { animation: blink 1s infinite; }
      .led-blink { animation: pulse_led 1.8s infinite; }
      .stream-line { stroke-dasharray: 10, 15; animation: stream_flow 3s linear infinite; }
    </style>

    <linearGradient id="win_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="bar_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="50%" stop-color="#1b202e"/>
      <stop offset="100%" stop-color="#141822"/>
    </linearGradient>
    <linearGradient id="text_red_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#ff2a55"/>
      <stop offset="100%" stop-color="#ff003c"/>
    </linearGradient>
    <pattern id="crt_grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="4" y2="4" stroke="#121620" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="846" height="376" rx="6" fill="url(#win_bg)" stroke="#ff003c" stroke-width="1.2"/>
  <rect x="3" y="3" width="844" height="374" fill="url(#crt_grid)" opacity="0.5"/>

  <!-- Titlebar -->
  <rect x="3" y="3" width="844" height="26" rx="5" fill="url(#bar_grad)" stroke="#222736" stroke-width="0.8"/>
  <rect x="12" y="9" width="8" height="8" rx="1" fill="#ff003c"/>
  <text x="28" y="20" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#e6edf3" letter-spacing="1.5">SYS.ARCHITECT // EMIRHAN_ÜNAL.EXE [ 鬼: CYBER-MITOS ]</text>
  
  <!-- Buttons -->
  <rect x="760" y="6" width="18" height="15" rx="2" fill="#151922" stroke="#484f58" stroke-width="0.8"/>
  <text x="766" y="17" font-family="monospace" font-size="10" fill="#c9d1d9">_</text>
  <rect x="784" y="6" width="18" height="15" rx="2" fill="#151922" stroke="#484f58" stroke-width="0.8"/>
  <text x="789" y="17" font-family="monospace" font-size="10" fill="#c9d1d9">□</text>
  <rect x="808" y="6" width="22" height="15" rx="2" fill="#ff003c" stroke="#ff2a55" stroke-width="0.8"/>
  <text x="815" y="17" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">✕</text>

  <!-- Side Data Lines -->
  <path d="M 40 180 L 320 180 L 370 200" stroke="#ff003c" stroke-width="1" fill="none" opacity="0.35" class="stream-line"/>
  <path d="M 810 180 L 530 180 L 480 200" stroke="#ff003c" stroke-width="1" fill="none" opacity="0.35" class="stream-line"/>

  <!-- CENTERED CYBER-ONI MASK (Exact Mathematical Symmetry at X=425) -->
  <g class="glitch-target">
    <!-- Horns -->
    <path d="M 385 90 Q 360 25 392 5 Q 388 55 394 80" fill="#0f131a" class="horn-target" stroke-width="2"/>
    <path d="M 465 90 Q 490 25 458 5 Q 462 55 456 80" fill="#0f131a" class="horn-target" stroke-width="2"/>
    <!-- Head Base Plate -->
    <polygon points="395,75 455,75 470,110 460,155 425,178 390,155 380,110" fill="#0a0d13" stroke="#252a36" stroke-width="1.5"/>
    <!-- Brow Crest -->
    <path d="M 385 95 Q 425 116 465 95 L 460 106 Q 425 125 390 106 Z" fill="#ff003c" opacity="0.9"/>
    <!-- Cyber Eyes -->
    <polygon points="398,112 415,116 411,122 395,118" class="eye-target"/>
    <polygon points="452,112 435,116 439,122 455,118" class="eye-target"/>
    <!-- Pupils -->
    <circle cx="405" cy="117" r="2.5" fill="#ffffff"/>
    <circle cx="445" cy="117" r="2.5" fill="#ffffff"/>
    <!-- Nose Breathing Vent -->
    <polygon points="420,126 430,126 434,140 416,140" fill="#141822" stroke="#ff003c" stroke-width="1"/>
    <!-- Mouth / Fangs Grille -->
    <rect x="400" y="146" width="50" height="14" rx="2" fill="#05070a" stroke="#ff003c" stroke-width="1"/>
    <polygon points="404,146 408,155 412,146" fill="#ffffff"/>
    <polygon points="416,146 420,153 424,146" fill="#ffffff"/>
    <polygon points="426,146 430,153 434,146" fill="#ffffff"/>
    <polygon points="438,146 442,155 446,146" fill="#ffffff"/>
    <!-- Chin Armor -->
    <polygon points="412,164 438,164 432,176 418,176" fill="#181d28" stroke="#2d3345" stroke-width="1"/>
    <!-- Cheek Circuit Scanlines -->
    <line x1="365" y1="126" x2="382" y2="126" stroke="#ff003c" stroke-width="1" opacity="0.8"/>
    <line x1="368" y1="132" x2="384" y2="132" stroke="#ff003c" stroke-width="1" opacity="0.8"/>
    <line x1="468" y1="126" x2="485" y2="126" stroke="#ff003c" stroke-width="1" opacity="0.8"/>
    <line x1="466" y1="132" x2="482" y2="132" stroke="#ff003c" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- Typography: EMIRHAN ÜNAL -->
  <text x="425" y="228" text-anchor="middle" font-family="'Segoe UI', -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#text_red_grad)" letter-spacing="6" class="glitch-target">EMIRHAN ÜNAL</text>
  
  <!-- Japanese Kanji Subtitle -->
  <text x="425" y="252" text-anchor="middle" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#8b949e" letter-spacing="3">「 電脳神話 • GAME DEV SHOGUN • 建築家の将軍 」</text>

  <!-- Animated Terminal Tagline -->
  <rect x="90" y="272" width="670" height="34" rx="4" fill="#07090e" stroke="#21262d" stroke-width="1"/>
  <text x="110" y="294" font-family="'Consolas', monospace" font-size="13" font-weight="600" fill="#00ff66" letter-spacing="1">> ARCHITECT OF COMPLEX, REAL-TIME MULTIPLAYER WORLDS</text>
  <rect x="620" y="281" width="9" height="16" fill="#00ff66" class="cursor-blink"/>

  <!-- Footer Hardware Telemetry Bar -->
  <rect x="3" y="342" width="844" height="35" rx="4" fill="#080a0f" stroke="#1c202c" stroke-width="0.8"/>
  <circle cx="28" cy="359" r="4" class="led-blink"/>
  <text x="42" y="363" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#c9d1d9" letter-spacing="1">TICK: 20Hz LOCKSTEP</text>
  
  <text x="250" y="363" font-family="'Consolas', monospace" font-size="11" fill="#8b949e">MEM: 64MB HEAP</text>
  <text x="420" y="363" font-family="'Consolas', monospace" font-size="11" fill="#8b949e">TESTS: 373 PASSING</text>
  <text x="615" y="363" font-family="'Consolas', monospace" font-size="11" fill="#ff4770">NETCODE: ZERO DESYNC</text>
  <text x="795" y="363" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#00ff66">ONLINE ●</text>

  <!-- Moving CRT Scanline -->
  <line x1="4" y1="0" x2="846" y2="0" stroke="#ff003c" stroke-width="2" opacity="0.25" style="animation: scanline 6s linear infinite;" />
</svg>