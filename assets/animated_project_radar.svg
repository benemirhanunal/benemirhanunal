<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes rotate_radar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes wave_pulse {
        0%, 100% { transform: scaleY(0.4); opacity: 0.5; }
        50% { transform: scaleY(1.3); opacity: 1; fill: #ff003c; }
      }
      @keyframes trajectory_dash {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes node_blip {
        0%, 100% { fill: #00ff66; filter: drop-shadow(0 0 4px #00ff66); }
        50% { fill: #ffffff; filter: drop-shadow(0 0 8px #ffffff); }
      }
      .radar-sweep { transform-origin: 702px 130px; animation: rotate_radar 4s linear infinite; }
      .w1 { animation: wave_pulse 1.2s infinite ease-in-out; }
      .w2 { animation: wave_pulse 1.5s infinite ease-in-out 0.2s; }
      .w3 { animation: wave_pulse 0.9s infinite ease-in-out 0.4s; }
      .w4 { animation: wave_pulse 1.4s infinite ease-in-out 0.1s; }
      .w5 { animation: wave_pulse 1.1s infinite ease-in-out 0.3s; }
      .traj-line { stroke-dasharray: 8, 6; animation: trajectory_dash 1.8s linear infinite; }
      .blip { animation: node_blip 1.6s infinite ease-in-out; }
    </style>
    <linearGradient id="grid_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="846" height="256" rx="6" fill="url(#grid_bg)" stroke="#ff003c" stroke-width="1.2"/>
  
  <!-- Window Titlebar -->
  <rect x="3" y="3" width="844" height="24" rx="5" fill="#141824" stroke="#222736" stroke-width="0.8"/>
  <text x="16" y="19" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#e6edf3" letter-spacing="1.5">⚡ SYSTEM_BLUEPRINTS.SYS // REAL-TIME ARCHITECTURAL TELEMETRY</text>
  <text x="790" y="19" font-family="monospace" font-size="11" fill="#8b949e">[ _ ][ □ ][ X ]</text>

  <!-- 3 COLUMNS -->

  <!-- COLUMN 1: CLINITOPYA (Neural Voice Pipeline) -->
  <rect x="18" y="38" width="260" height="206" rx="4" fill="#07090e" stroke="#21262d" stroke-width="1"/>
  <rect x="26" y="46" width="244" height="20" rx="3" fill="#101420"/>
  <text x="32" y="60" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#ff2a55">🦊 CLINITOPYA: VR NEURAL AI</text>
  
  <!-- Animated Soundwave Bars -->
  <g transform="translate(40, 110)">
    <rect x="0" y="-15" width="4" height="30" rx="1" fill="#ff003c" class="w1"/>
    <rect x="8" y="-22" width="4" height="44" rx="1" fill="#ff2a55" class="w2"/>
    <rect x="16" y="-30" width="4" height="60" rx="1" fill="#ff4770" class="w3"/>
    <rect x="24" y="-18" width="4" height="36" rx="1" fill="#ff003c" class="w4"/>
    <rect x="32" y="-25" width="4" height="50" rx="1" fill="#ff2a55" class="w5"/>
    <rect x="40" y="-12" width="4" height="24" rx="1" fill="#ff003c" class="w1"/>
    <rect x="48" y="-20" width="4" height="40" rx="1" fill="#ff2a55" class="w2"/>
    <rect x="56" y="-28" width="4" height="56" rx="1" fill="#ff4770" class="w3"/>
  </g>
  <!-- Pipeline Data Path -->
  <path d="M 120 110 L 220 110 L 250 140" stroke="#00ff66" stroke-width="1.5" fill="none" class="traj-line"/>
  <circle cx="220" cy="110" r="3.5" class="blip"/>
  <text x="125" y="98" font-family="'Consolas', monospace" font-size="9" fill="#00ff66">VOICE IN &gt; GEMINI LLM</text>
  <text x="125" y="125" font-family="'Consolas', monospace" font-size="9" fill="#ff4770">ELEVENLABS TTS: &lt;6s</text>
  <text x="125" y="150" font-family="'Consolas', monospace" font-size="9" fill="#8b949e">CC5 VISEME LIP-SYNC</text>
  <rect x="26" y="200" width="244" height="34" rx="3" fill="#0b0e17"/>
  <text x="32" y="214" font-family="'Segoe UI', sans-serif" font-size="9" fill="#c9d1d9">• 10 Clinical Metrics Auto-Evaluation</text>
  <text x="32" y="227" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8b949e">• Unity 6 • Meta Quest 3 VR</text>

  <!-- COLUMN 2: NUTREVOLT (Kinetic Physics) -->
  <rect x="295" y="38" width="260" height="206" rx="4" fill="#07090e" stroke="#21262d" stroke-width="1"/>
  <rect x="303" y="46" width="244" height="20" rx="3" fill="#101420"/>
  <text x="309" y="60" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#ff2a55">🦝 NUTREVOLT: KINETIC PHYSICS</text>
  
  <!-- Animated Parabolic Trajectory -->
  <path d="M 315 170 Q 370 70 420 120 T 520 160" stroke="#ff003c" stroke-width="2" fill="none" class="traj-line"/>
  <circle cx="315" cy="170" r="4" fill="#ff003c"/>
  <circle cx="420" cy="120" r="3.5" class="blip"/>
  <circle cx="520" cy="160" r="4" fill="#ff2a55"/>
  <text x="315" y="90" font-family="'Consolas', monospace" font-size="9" fill="#ff4770">ARCADE COLLISION KINEMATICS</text>
  <text x="315" y="105" font-family="'Consolas', monospace" font-size="9" fill="#c9d1d9">CHEEK BOOST &amp; BELLY SLAM</text>
  
  <rect x="303" y="200" width="244" height="34" rx="3" fill="#0b0e17"/>
  <text x="309" y="214" font-family="'Segoe UI', sans-serif" font-size="9" fill="#c9d1d9">• Zero GC-Alloc Object Pooling</text>
  <text x="309" y="227" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8b949e">• Unity 6 Mobile • ASMDEF</text>

  <!-- COLUMN 3: DRAFTINRIFT (20Hz Lockstep Radar) -->
  <rect x="572" y="38" width="260" height="206" rx="4" fill="#07090e" stroke="#21262d" stroke-width="1"/>
  <rect x="580" y="46" width="244" height="20" rx="3" fill="#101420"/>
  <text x="586" y="60" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#ff2a55">🐉 DRAFTINRIFT: 20Hz ENGINE</text>
  
  <!-- Radar Target Grid -->
  <circle cx="702" cy="130" r="45" stroke="#1f2430" stroke-width="1" fill="none"/>
  <circle cx="702" cy="130" r="30" stroke="#1f2430" stroke-width="1" fill="none"/>
  <circle cx="702" cy="130" r="15" stroke="#1f2430" stroke-width="1" fill="none"/>
  <line x1="657" y1="130" x2="747" y2="130" stroke="#1f2430" stroke-width="0.8"/>
  <line x1="702" y1="85" x2="702" y2="175" stroke="#1f2430" stroke-width="0.8"/>
  
  <!-- Radar Beam Rotating -->
  <g class="radar-sweep">
    <line x1="702" y1="130" x2="747" y2="130" stroke="#00ff66" stroke-width="2" opacity="0.9"/>
  </g>
  <circle cx="718" cy="115" r="3" class="blip"/>
  <circle cx="685" cy="142" r="3" class="blip"/>

  <text x="586" y="86" font-family="'Consolas', monospace" font-size="9" fill="#00ff66">20Hz DETERMINISTIC</text>
  <text x="586" y="185" font-family="'Consolas', monospace" font-size="9" fill="#ff2a55">CHECKSUM: 0x8F9A [VALID]</text>
  
  <rect x="580" y="200" width="244" height="34" rx="3" fill="#0b0e17"/>
  <text x="586" y="214" font-family="'Segoe UI', sans-serif" font-size="9" fill="#c9d1d9">• 373 Verified Passing Tests</text>
  <text x="586" y="227" font-family="'Segoe UI', sans-serif" font-size="9" fill="#8b949e">• Strict Decoupled Domain Authority</text>
</svg>