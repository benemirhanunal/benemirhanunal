<svg width="850" height="260" viewBox="0 0 850 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <linearGradient id="wave_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff003c" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#ff003c" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ff003c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line_gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a55"/>
      <stop offset="30%" stop-color="#ff003c"/>
      <stop offset="60%" stop-color="#ff4770"/>
      <stop offset="100%" stop-color="#ff003c"/>
    </linearGradient>
    <filter id="neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card with Chamfered Cyber Corners -->
  <path d="M 20 10 L 830 10 L 840 20 L 840 240 L 830 250 L 20 250 L 10 240 L 10 20 Z" fill="url(#card_bg)" stroke="#222530" stroke-width="1.2"/>
  
  <!-- Subtle Corner Cyber Accents -->
  <path d="M 10 35 L 10 20 L 25 10 L 45 10" stroke="#ff003c" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M 805 10 L 830 10 L 840 20 L 840 40" stroke="#ff003c" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M 10 225 L 10 240 L 20 250 L 45 250" stroke="#ff003c" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M 805 250 L 830 250 L 840 240 L 840 225" stroke="#ff003c" stroke-width="2" fill="none" opacity="0.85"/>

  <!-- Card Title & Subtitle -->
  <text x="425" y="38" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="3">DIGITAL LEGACY // MY GIT JOURNEY</text>
  <text x="425" y="55" text-anchor="middle" font-family="'Segoe UI', -apple-system, monospace" font-size="10" fill="#8b949e" letter-spacing="1.5">REAL-TIME MULTIPLAYER SIMULATION VELOCITY &amp; ARCHITECTURAL COMMITS</text>

  <!-- Grid Lines -->
  <g stroke="#1a1e29" stroke-width="0.8" stroke-dasharray="3,3">
    <line x1="60" y1="80" x2="790" y2="80" />
    <line x1="60" y1="120" x2="790" y2="120" />
    <line x1="60" y1="160" x2="790" y2="160" />
    <line x1="60" y1="200" x2="790" y2="200" />
  </g>

  <!-- Axis & Labels -->
  <line x1="60" y1="210" x2="790" y2="210" stroke="#2d3342" stroke-width="1"/>
  
  <text x="50" y="84" text-anchor="end" font-family="monospace" font-size="9" fill="#586069">180+</text>
  <text x="50" y="124" text-anchor="end" font-family="monospace" font-size="9" fill="#586069">120</text>
  <text x="50" y="164" text-anchor="end" font-family="monospace" font-size="9" fill="#586069">60</text>
  <text x="50" y="204" text-anchor="end" font-family="monospace" font-size="9" fill="#586069">0</text>

  <text x="110" y="228" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff4770">⛩️ GENESIS</text>
  <text x="270" y="228" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff4770">⛩️ DOJO &amp; VR</text>
  <text x="430" y="228" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff4770">⛩️ SIMULATION</text>
  <text x="590" y="228" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff4770">⛩️ CLOUD TPS</text>
  <text x="740" y="228" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff4770">⛩️ SHOGUNATE</text>

  <!-- Wave Area Fill -->
  <path d="M 80 210 
           C 110 180, 140 130, 180 145 
           C 220 160, 250 110, 290 120 
           C 330 130, 370 170, 410 130 
           C 450 90, 480 150, 520 110 
           C 560 70, 600 130, 640 95 
           C 680 60, 720 110, 760 75 
           L 760 210 Z" 
        fill="url(#wave_gradient)"/>

  <!-- Waveform Stroke with Glow -->
  <path d="M 80 210 
           C 110 180, 140 130, 180 145 
           C 220 160, 250 110, 290 120 
           C 330 130, 370 170, 410 130 
           C 450 90, 480 150, 520 110 
           C 560 70, 600 130, 640 95 
           C 680 60, 720 110, 760 75" 
        stroke="url(#line_gradient)" stroke-width="2.5" fill="none" filter="url(#neon_glow)"/>

  <!-- Milestone Nodes (Glowing Cyber Dots) -->
  <g filter="url(#neon_glow)">
    <circle cx="110" cy="180" r="4" fill="#ff003c" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="270" cy="115" r="4" fill="#ff003c" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="430" cy="110" r="4" fill="#ff003c" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="590" cy="85" r="4" fill="#ff003c" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="760" cy="75" r="5" fill="#ff2a55" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Live Metric Badge Overlay -->
  <rect x="660" y="22" width="165" height="26" rx="4" fill="#151922" stroke="#ff003c" stroke-width="1"/>
  <circle cx="674" cy="35" r="3.5" fill="#00ff66"/>
  <text x="684" y="39" font-family="'Segoe UI', monospace" font-size="10" font-weight="700" fill="#e6edf3" letter-spacing="1">SYSTEMS ONLINE</text>
</svg>