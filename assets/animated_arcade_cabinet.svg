<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes insert_coin_blink {
        0%, 49% { opacity: 1; fill: #ff003c; }
        50%, 100% { opacity: 0; fill: #ffffff; }
      }
      @keyframes slash_motion {
        0% { transform: translate(0, 0) scaleX(1); }
        40% { transform: translate(15px, -5px) scaleX(1.1); }
        50% { transform: translate(25px, 0px) scaleX(1.2); }
        70% { transform: translate(0, 0) scaleX(1); }
        100% { transform: translate(0, 0) scaleX(1); }
      }
      @keyframes slash_fx {
        0%, 45% { opacity: 0; stroke-dashoffset: 40; }
        50% { opacity: 1; stroke-dashoffset: 0; stroke: #ffffff; }
        65% { opacity: 0.8; stroke: #ff003c; }
        75%, 100% { opacity: 0; }
      }
      @keyframes bug_shake {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(3px, -2px); }
      }
      .coin-text { animation: insert_coin_blink 1.2s infinite; }
      .samurai-slash { animation: slash_motion 2s ease-in-out infinite; }
      .katana-trail { stroke-dasharray: 40; animation: slash_fx 2s ease-in-out infinite; }
      .bug-target { animation: bug_shake 0.8s infinite; }
    </style>
    <linearGradient id="arc_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <pattern id="arc_crt" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="4" y2="4" stroke="#141822" stroke-width="0.75"/>
    </pattern>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="846" height="236" rx="6" fill="url(#arc_bg)" stroke="#222530" stroke-width="1.2"/>
  <rect x="3" y="3" width="844" height="234" fill="url(#arc_crt)" opacity="0.4"/>

  <!-- Titlebar -->
  <rect x="3" y="3" width="844" height="24" rx="5" fill="#141824" stroke="#1f2430" stroke-width="0.8"/>
  <rect x="12" y="9" width="8" height="8" rx="1" fill="#ff003c"/>
  <text x="28" y="19" font-family="'Consolas', monospace" font-size="11" font-weight="700" fill="#e6edf3" letter-spacing="1.5">SYS.GAMIFICATION // 1-BIT CYBER-ARCADE CABINET [ PLAYABLE QUEST ]</text>
  <text x="790" y="19" font-family="monospace" font-size="11" fill="#8b949e">[ _ ][ □ ][ X ]</text>

  <!-- Left: Arcade CRT Screen with 1-Bit Animated Pixel Combat -->
  <rect x="16" y="36" width="370" height="152" rx="4" fill="#06080d" stroke="#ff003c" stroke-width="0.8"/>
  
  <!-- CRT Header -->
  <rect x="22" y="42" width="358" height="16" rx="2" fill="#101420"/>
  <text x="30" y="54" font-family="'Consolas', monospace" font-size="9" fill="#00ff66">STAGE 01: DESYNC MONSTER BATTLE</text>
  <text x="320" y="54" font-family="'Consolas', monospace" font-size="9" fill="#ff4770">20Hz TICK</text>

  <!-- Ground Line -->
  <line x1="22" y1="150" x2="380" y2="150" stroke="#21262d" stroke-width="1.5"/>

  <!-- 1-Bit Pixel Samurai (Animated Slash) -->
  <g class="samurai-slash" transform="translate(60, 95)">
    <!-- Helmet & Oni Crest -->
    <rect x="12" y="0" width="16" height="10" fill="#ffffff"/>
    <polygon points="8,0 20,-10 14,0" fill="#ff003c"/>
    <polygon points="32,0 20,-10 26,0" fill="#ff003c"/>
    <!-- Glowing Eye -->
    <rect x="22" y="4" width="4" height="2" fill="#ff003c"/>
    <!-- Body Armor & Robes -->
    <rect x="8" y="10" width="24" height="25" fill="#e6edf3"/>
    <line x1="8" y1="18" x2="32" y2="18" stroke="#ff003c" stroke-width="2"/>
    <!-- Legs -->
    <rect x="10" y="35" width="8" height="20" fill="#8b949e"/>
    <rect x="22" y="35" width="8" height="20" fill="#8b949e"/>
    <!-- Katana & Slash Arc -->
    <line x1="28" y1="18" x2="65" y2="10" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 28 35 Q 75 0 95 30" fill="none" stroke-width="3" class="katana-trail"/>
  </g>

  <!-- Enemy: Desync Bug Entity (Shaking) -->
  <g class="bug-target" transform="translate(260, 105)">
    <!-- Bug Body -->
    <polygon points="20,0 35,15 35,35 20,45 5,35 5,15" fill="#141824" stroke="#ff003c" stroke-width="1.5"/>
    <!-- Glowing Core -->
    <circle cx="20" cy="22" r="6" fill="#ff003c"/>
    <text x="20" y="25" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffffff">!</text>
    <!-- Legs -->
    <line x1="5" y1="15" x2="-5" y2="5" stroke="#ff003c" stroke-width="1.5"/>
    <line x1="5" y1="30" x2="-8" y2="35" stroke="#ff003c" stroke-width="1.5"/>
    <line x1="35" y1="15" x2="45" y2="5" stroke="#ff003c" stroke-width="1.5"/>
    <line x1="35" y1="30" x2="48" y2="35" stroke="#ff003c" stroke-width="1.5"/>
    <!-- Label -->
    <text x="20" y="-4" text-anchor="middle" font-family="'Consolas', monospace" font-size="8" fill="#ff4770">DESYNC_BUG</text>
  </g>

  <!-- Insert Coin Blinking Text -->
  <text x="201" y="176" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" font-weight="700" class="coin-text" letter-spacing="2">▶ INSERT COIN // CHOOSE YOUR QUEST BELOW ◀</text>

  <!-- Right: High Score Leaderboard & Game Engine Telemetry -->
  <rect x="398" y="36" width="436" height="152" rx="4" fill="#07090e" stroke="#21262d" stroke-width="0.8"/>
  <rect x="406" y="44" width="420" height="20" rx="3" fill="#101420"/>
  <text x="416" y="58" font-family="'Consolas', monospace" font-size="10.5" font-weight="700" fill="#ff2a55">🏆 HALL OF FAME // TOP ARCHITECT HIGH SCORES</text>

  <text x="416" y="84" font-family="'Consolas', monospace" font-size="10" fill="#00ff66">1ST</text>
  <text x="450" y="84" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#ffffff">EMIRHAN ÜNAL</text>
  <text x="620" y="84" font-family="'Consolas', monospace" font-size="9" fill="#8b949e">[ SHOGUN ]</text>
  <text x="810" y="84" text-anchor="end" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#ff003c">999,999 PTS</text>

  <text x="416" y="104" font-family="'Consolas', monospace" font-size="10" fill="#8b949e">2ND</text>
  <text x="450" y="104" font-family="'Consolas', monospace" font-size="10" fill="#c9d1d9">NETCODE SLAYER</text>
  <text x="620" y="104" font-family="'Consolas', monospace" font-size="9" fill="#8b949e">[ 0 DESYNC ]</text>
  <text x="810" y="104" text-anchor="end" font-family="'Consolas', monospace" font-size="10" fill="#ffffff">373,000 PTS</text>

  <text x="416" y="124" font-family="'Consolas', monospace" font-size="10" fill="#8b949e">3RD</text>
  <text x="450" y="124" font-family="'Consolas', monospace" font-size="10" fill="#c9d1d9">KINETIC TANUKI</text>
  <text x="620" y="124" font-family="'Consolas', monospace" font-size="9" fill="#8b949e">[ BOOSTER ]</text>
  <text x="810" y="124" text-anchor="end" font-family="'Consolas', monospace" font-size="10" fill="#ffffff">250,000 PTS</text>

  <rect x="406" y="140" width="420" height="40" rx="3" fill="#0b0e17"/>
  <text x="416" y="156" font-family="'Consolas', monospace" font-size="9.5" fill="#00ff66">QUEST MECHANICS: INTERACTIVE TERMINAL RPG</text>
  <text x="416" y="172" font-family="'Consolas', monospace" font-size="8.5" fill="#8b949e">Click on the quest nodes below to execute abilities and defeat bugs!</text>

  <!-- Bottom Instructions Bar -->
  <rect x="16" y="196" width="818" height="34" rx="3" fill="#090b10" stroke="#181c28" stroke-width="0.8"/>
  <text x="28" y="217" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#00ff66">> CONTROLS: EXPAND TO CHOOSE ACTIONS</text>
  <text x="420" y="217" font-family="'Consolas', monospace" font-size="10" fill="#8b949e">REWARD: UNLOCK HIDDEN ARCHITECT LORE</text>
  <text x="760" y="217" font-family="'Consolas', monospace" font-size="10" font-weight="700" fill="#ff003c">[ READY ● ]</text>
</svg>