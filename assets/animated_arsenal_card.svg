<svg width="850" height="360" viewBox="0 0 850 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulse_node {
        0%, 100% { fill: #00ff66; filter: drop-shadow(0 0 4px #00ff66); }
        50% { fill: #ffffff; filter: drop-shadow(0 0 8px #ffffff); }
      }
      @keyframes wave_motion {
        0%, 100% { height: 6px; y: 285px; }
        50% { height: 18px; y: 273px; fill: #ff2a55; }
      }
      @keyframes trajectory_flow {
        0% { stroke-dashoffset: 80; }
        100% { stroke-dashoffset: 0; }
      }
      .node-blip { animation: pulse_node 2s infinite ease-in-out; }
      .wave-bar-1 { animation: wave_motion 1s infinite ease-in-out; }
      .wave-bar-2 { animation: wave_motion 1.3s infinite ease-in-out 0.2s; }
      .wave-bar-3 { animation: wave_motion 0.9s infinite ease-in-out 0.4s; }
      .traj-stream { stroke-dasharray: 6, 6; animation: trajectory_flow 1.5s linear infinite; }
    </style>
    <linearGradient id="ars_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0f17"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <pattern id="ars_crt" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="4" y2="4" stroke="#121620" stroke-width="0.75"/>
    </pattern>
  </defs>

