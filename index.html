<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>SHOGUN: ZERO DESYNC // Katana Reflex Slasher</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: #050608;
      color: #ffffff;
      font-family: 'Consolas', 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .cabinet {
      border: 2px solid #ff003c;
      border-radius: 8px;
      padding: 12px;
      background: #0d0f17;
      box-shadow: 0 0 40px rgba(255, 0, 60, 0.35);
      max-width: 820px;
      width: 96%;
      text-align: center;
      transition: box-shadow 0.3s;
    }
    .titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141824;
      padding: 8px 14px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 13px;
      color: #e6edf3;
      letter-spacing: 1px;
    }
    .canvas-container {
      position: relative;
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
    }
    canvas {
      background: #020305;
      border: 1px solid #21262d;
      width: 100%;
      height: 380px;
      display: block;
      image-rendering: pixelated;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px 4px 6px;
      font-size: 12px;
      color: #8b949e;
    }
    .hud span { color: #00ff66; font-weight: bold; }
    .hud .red { color: #ff003c; }
    .hud .level-badge {
      background: #1a1e2c;
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid #ff003c;
      color: #ffffff;
      transition: background 0.3s, color 0.3s;
    }
    .touch-controls {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .touch-btn {
      flex: 1;
      background: #121622;
      border: 1px solid #ff003c;
      color: #fff;
      padding: 13px 0;
      font-family: 'Consolas', monospace;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.1s;
    }
    .touch-btn:active {
      background: #ff003c;
      color: #fff;
    }
    .instructions {
      margin-top: 6px;
      font-size: 11px;
      color: #8b949e;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

<div class="cabinet" id="cabinetBox">
  <div class="titlebar">
    <span>⛩️ SHOGUN: REFLEX SLASHER // 20Hz LOCKSTEP</span>
    <span style="color: #ff003c;">[ ARCHITECT: EMIRHAN ÜNAL ]</span>
  </div>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div class="hud">
    <div>SCORE: <span id="scoreVal">0</span> PTS</div>
    <div>COMBO: <span id="comboVal" class="red">0x</span></div>
    <div>STAGE: <span id="levelVal" class="level-badge">LVL 1 (EASY START)</span></div>
    <div>BEST: <span id="bestVal">0</span> PTS</div>
  </div>

  <!-- Touch / Click Buttons -->
  <div class="touch-controls">
    <button class="touch-btn" id="btnLeft">◀ SLASH LEFT [A / ←]</button>
    <button class="touch-btn" id="btnRight">SLASH RIGHT [D / →] ▶</button>
  </div>

  <div class="instructions">
    [ ← / A ] SLASH LEFT &nbsp;|&nbsp; [ → / D ] SLASH RIGHT &nbsp;|&nbsp; RELAXED TIMING // RED AURA INTENSIFIES!
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const cabinetBox = document.getElementById('cabinetBox');

  const scoreVal = document.getElementById('scoreVal');
  const comboVal = document.getElementById('comboVal');
  const levelVal = document.getElementById('levelVal');
  const bestVal = document.getElementById('bestVal');

  let bestScore = parseInt(localStorage.getItem('shogun_best_score') || '0', 10);
  bestVal.textContent = bestScore;

  // Game State
  let score = 0;
  let combo = 0;
  let maxCombo = 0;
  let currentLevel = 1;
  let gameOver = false;
  let gameStarted = false;
  let frame = 0;
  let shakeTimer = 0;
  let levelBannerTimer = 0;
  let levelBannerText = "";

  // Center Samurai
  const samurai = {
    x: 400,
    y: 280,
    facing: 1,
    slashTimer: 0,
    slashDir: 0
  };

  // MUCH WIDER, FORGIVING STRIKE ZONES (Super accessible & satisfying)
  const STRIKE_DIST_MIN = 12;
  const STRIKE_DIST_MAX = 175;
  const PERFECT_DIST_MIN = 35;
  const PERFECT_DIST_MAX = 135;

  // Entities & Particles
  const targets = [];
  const particles = [];
  const slashArcs = [];
  const floatTexts = [];

  // Web Audio Synth
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.12) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function playSlashSound(isCritical = false) {
    if (isCritical) {
      playTone(1100, 'sawtooth', 0.12, 0.18);
      setTimeout(() => playTone(1450, 'square', 0.09, 0.15), 35);
    } else {
      playTone(850, 'sawtooth', 0.09, 0.14);
      setTimeout(() => playTone(600, 'sine', 0.08, 0.1), 30);
    }
  }

  function playLevelUpSound() {
    playTone(520, 'square', 0.1, 0.15);
    setTimeout(() => playTone(660, 'square', 0.1, 0.15), 80);
    setTimeout(() => playTone(880, 'square', 0.18, 0.2), 160);
  }

  function playMissSound() {
    playTone(180, 'sawtooth', 0.25, 0.2);
    setTimeout(() => playTone(130, 'square', 0.35, 0.2), 60);
  }

  function playWhoosh() {
    playTone(320, 'sine', 0.06, 0.08);
  }

  // GENTLE PROGRESSIVE SPEED SCALING (Very easy to start, climbs smoothly)
  function getEnemySpeed() {
    if (score < 600) {
      // Level 1: Very gentle, easy start
      return 1.4 + Math.random() * 0.3;
    } else if (score < 1600) {
      // Level 2: Comfortable flow
      return 2.1 + Math.random() * 0.4;
    } else if (score < 3200) {
      // Level 3: Pleasant rhythm
      return 2.9 + Math.random() * 0.5;
    } else if (score < 5500) {
      // Level 4: Focused reflex
      return 3.8 + Math.random() * 0.6;
    } else {
      // Level 5: Intense Shogun
      return 4.8 + Math.min((score - 5500) / 2000, 1.8);
    }
  }

  // SPAWN INTERVALS (Lots of breathing room)
  function getSpawnInterval() {
    if (score < 600) return 145; // ~2.4 seconds between bugs (Very easy!)
    if (score < 1600) return 115; // ~1.9 seconds
    if (score < 3200) return 90;  // ~1.5 seconds
    if (score < 5500) return 70;  // ~1.1 seconds
    return 52;                   // Smooth reflex pace
  }

  // Update Level & Visual Red Intensity
  function getRedIntensity() {
    return Math.min(score / 5000, 1.0); // 0.0 at start -> 1.0 at peak
  }

  function checkLevelProgression() {
    let newLevel = 1;
    let label = "LVL 1 (EASY START)";

    if (score >= 5500) {
      newLevel = 5;
      label = "LVL 5 (CRIMSON OVERCLOCK ⚡)";
    } else if (score >= 3200) {
      newLevel = 4;
      label = "LVL 4 (BLOOD MOON)";
    } else if (score >= 1600) {
      newLevel = 3;
      label = "LVL 3 (20Hz LOCKSTEP)";
    } else if (score >= 600) {
      newLevel = 2;
      label = "LVL 2 (NETCODE FLOW)";
    }

    if (newLevel > currentLevel) {
      currentLevel = newLevel;
      levelBannerText = "STAGE UP! // " + label;
      levelBannerTimer = 75;
      playLevelUpSound();
      shakeTimer = 8;
    }

    levelVal.textContent = label;

    // Cabinet Shadow Red Intensity
    const intensity = getRedIntensity();
    const shadowAlpha = 0.3 + intensity * 0.5;
    const shadowSpread = 30 + intensity * 35;
    cabinetBox.style.boxShadow = `0 0 ${shadowSpread}px rgba(255, 0, 60, ${shadowAlpha})`;
  }

  // Spawning Enemies
  function spawnTarget() {
    const side = Math.random() < 0.5 ? -1 : 1;
    const startX = side === -1 ? -30 : 830;
    const speed = getEnemySpeed() * (side === -1 ? 1 : -1);

    const types = ['DESYNC_BUG', 'PACKET_LOSS', 'MEMORY_LEAK'];
    const type = types[Math.floor(Math.random() * types.length)];

    targets.push({
      x: startX,
      y: 280,
      side: side,
      speed: speed,
      type: type,
      spawnTime: performance.now(),
      w: 24,
      h: 24,
      slashed: false
    });
  }

  function createParticles(x, y, count = 16) {
    const intensity = getRedIntensity();
    const totalCount = Math.floor(count * (1 + intensity * 0.8));

    for (let i = 0; i < totalCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2.5 + Math.random() * 6.0;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.5,
        life: 25 + Math.random() * 15,
        color: Math.random() < 0.3 ? '#ffffff' : (Math.random() < 0.6 ? '#ff003c' : '#ff2a55'),
        isBit: Math.random() < 0.5,
        char: Math.random() < 0.5 ? '0' : '1'
      });
    }
  }

  function addFloatText(text, x, y, color = '#00ff66') {
    floatTexts.push({
      text: text,
      x: x,
      y: y,
      vy: -1.6,
      life: 38,
      color: color
    });
  }

  // Execute Katana Slash
  function executeSlash(dir) {
    if (gameOver) {
      restartGame();
      return;
    }
    if (!gameStarted) {
      gameStarted = true;
    }

    samurai.facing = dir;
    samurai.slashTimer = 11;
    samurai.slashDir = dir;

    playWhoosh();

    // Slash Arc Visual
    slashArcs.push({
      x: samurai.x + dir * 35,
      y: samurai.y,
      dir: dir,
      life: 11
    });

    let hitFound = false;

    for (let i = 0; i < targets.length; i++) {
      const t = targets[i];
      if (t.slashed) continue;

      const dist = Math.abs(t.x - samurai.x);
      const correctDirection = (dir === -1 && t.x < samurai.x) || (dir === 1 && t.x > samurai.x);

      if (correctDirection && dist >= STRIKE_DIST_MIN && dist <= STRIKE_DIST_MAX) {
        hitFound = true;
        t.slashed = true;

        const isPerfect = (dist >= PERFECT_DIST_MIN && dist <= PERFECT_DIST_MAX);
        const basePts = isPerfect ? 200 : 100;

        combo++;
        if (combo > maxCombo) maxCombo = combo;
        comboVal.textContent = combo + 'x';

        score += basePts + (combo * 15);
        scoreVal.textContent = score;

        checkLevelProgression();

        if (score > bestScore) {
          bestScore = score;
          bestVal.textContent = bestScore;
          localStorage.setItem('shogun_best_score', bestScore.toString());
        }

        shakeTimer = isPerfect ? 6 : 3;
        createParticles(t.x, t.y, isPerfect ? 24 : 14);
        playSlashSound(isPerfect);

        if (isPerfect) {
          addFloatText('PERFECT CRITICAL! 20Hz', t.x, t.y - 22, '#00ff66');
        } else {
          addFloatText('SLASHED!', t.x, t.y - 22, '#ffffff');
        }

        targets.splice(i, 1);
        break;
      }
    }

    // Gentle whiff handling (don't harshly break combo unless high combo)
    if (!hitFound && combo > 4) {
      addFloatText('COMBO RESET', samurai.x + dir * 40, samurai.y - 30, '#ff003c');
      combo = 0;
      comboVal.textContent = '0x';
    }
  }

  function restartGame() {
    score = 0;
    combo = 0;
    currentLevel = 1;
    targets.length = 0;
    particles.length = 0;
    slashArcs.length = 0;
    floatTexts.length = 0;
    scoreVal.textContent = '0';
    comboVal.textContent = '0x';
    levelVal.textContent = 'LVL 1 (EASY START)';
    cabinetBox.style.boxShadow = '0 0 40px rgba(255, 0, 60, 0.35)';
    gameOver = false;
    gameStarted = true;
  }

  // Keyboard Listeners
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      e.preventDefault();
      executeSlash(-1);
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      e.preventDefault();
      executeSlash(1);
    } else if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (gameOver) {
        restartGame();
      } else {
        executeSlash(samurai.facing);
      }
    }
  });

  // Touch & Button Listeners
  document.getElementById('btnLeft').addEventListener('click', e => {
    e.preventDefault();
    executeSlash(-1);
  });
  document.getElementById('btnRight').addEventListener('click', e => {
    e.preventDefault();
    executeSlash(1);
  });

  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    if (clickX < rect.width / 2) {
      executeSlash(-1);
    } else {
      executeSlash(1);
    }
  });

  // Main Loop
  function update() {
    frame++;

    if (shakeTimer > 0) shakeTimer--;
    if (levelBannerTimer > 0) levelBannerTimer--;

    if (gameStarted && !gameOver) {
      const interval = getSpawnInterval();
      if (frame % interval === 0) {
        spawnTarget();
      }

      for (let i = targets.length - 1; i >= 0; i--) {
        const t = targets[i];
        t.x += t.speed;

        // Collision with central Samurai
        if ((t.side === -1 && t.x >= samurai.x - 14) || (t.side === 1 && t.x <= samurai.x + 14)) {
          gameOver = true;
          shakeTimer = 16;
          createParticles(samurai.x, samurai.y, 35);
          playMissSound();
          break;
        }
      }
    }

    if (samurai.slashTimer > 0) samurai.slashTimer--;

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.14;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Slash Arcs
    for (let i = slashArcs.length - 1; i >= 0; i--) {
      slashArcs[i].life--;
      if (slashArcs[i].life <= 0) slashArcs.splice(i, 1);
    }

    // Float Texts
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      floatTexts[i].y += floatTexts[i].vy;
      floatTexts[i].life--;
      if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
    }

    draw();
    requestAnimationFrame(update);
  }

  function draw() {
    ctx.save();

    if (shakeTimer > 0) {
      const dx = (Math.random() - 0.5) * shakeTimer * 1.5;
      const dy = (Math.random() - 0.5) * shakeTimer * 1.5;
      ctx.translate(dx, dy);
    }

    const intensity = getRedIntensity();

    // Clear Canvas with Dynamic Red Ambient Glow as score increases
    const rBg = Math.floor(5 + intensity * 28);
    const gBg = Math.floor(7 - intensity * 4);
    const bBg = Math.floor(12 - intensity * 6);
    ctx.fillStyle = `rgb(${rBg}, ${gBg}, ${bBg})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Dynamic Crimson Grid
    const gridR = Math.floor(24 + intensity * 80);
    const gridG = Math.floor(29 - intensity * 15);
    const gridB = Math.floor(40 - intensity * 25);
    ctx.strokeStyle = `rgb(${gridR}, ${gridG}, ${gridB})`;
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, 320);
      ctx.stroke();
    }

    ctx.strokeStyle = `rgb(${Math.floor(45 + intensity * 160)}, 45, 60)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 320);
    ctx.lineTo(canvas.width, 320);
    ctx.stroke();

    // DYNAMIC RED INTENSITY STRIKE ZONES
    const strikeAlpha = 0.08 + intensity * 0.22;
    const borderAlpha = 0.35 + intensity * 0.45;

    // Left Strike Zone
    ctx.fillStyle = `rgba(255, 0, 60, ${strikeAlpha})`;
    ctx.fillRect(samurai.x - STRIKE_DIST_MAX, 220, STRIKE_DIST_MAX - STRIKE_DIST_MIN, 100);
    ctx.strokeStyle = `rgba(255, 0, 60, ${borderAlpha})`;
    ctx.lineWidth = 1 + intensity * 1.5;
    ctx.strokeRect(samurai.x - STRIKE_DIST_MAX, 220, STRIKE_DIST_MAX - STRIKE_DIST_MIN, 100);

    // Right Strike Zone
    ctx.fillRect(samurai.x + STRIKE_DIST_MIN, 220, STRIKE_DIST_MAX - STRIKE_DIST_MIN, 100);
    ctx.strokeRect(samurai.x + STRIKE_DIST_MIN, 220, STRIKE_DIST_MAX - STRIKE_DIST_MIN, 100);

    // Perfect Center Target Rings (Pulsing with red energy)
    const ringRadius = 24 + (Math.sin(frame * 0.1) * (2 + intensity * 4));
    ctx.strokeStyle = '#ff003c';
    ctx.lineWidth = 1.5 + intensity * 1.5;
    ctx.beginPath();
    ctx.arc(samurai.x - (PERFECT_DIST_MIN + PERFECT_DIST_MAX)/2, 280, ringRadius, 0, Math.PI * 2);
    ctx.arc(samurai.x + (PERFECT_DIST_MIN + PERFECT_DIST_MAX)/2, 280, ringRadius, 0, Math.PI * 2);
    ctx.stroke();

    // Draw Targets
    for (const t of targets) {
      ctx.save();
      ctx.translate(t.x, t.y);

      ctx.fillStyle = '#0f1420';
      ctx.strokeStyle = '#ff003c';
      ctx.lineWidth = 2 + intensity * 0.8;
      ctx.fillRect(-13, -13, 26, 26);
      ctx.strokeRect(-13, -13, 26, 26);

      // Core Glowing Eye
      ctx.fillStyle = '#ff003c';
      ctx.beginPath();
      ctx.arc(0, 0, 5 + intensity * 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ff4770';
      ctx.font = 'bold 9.5px Consolas';
      ctx.textAlign = 'center';
      ctx.fillText(t.type, 0, -18);

      ctx.restore();
    }

    // Draw Center Samurai
    ctx.save();
    ctx.translate(samurai.x, samurai.y);

    ctx.fillStyle = '#0a0d14';
    ctx.strokeStyle = '#ff003c';
    ctx.lineWidth = 1.5;
    ctx.fillRect(-14, -25, 28, 50);
    ctx.strokeRect(-14, -25, 28, 50);

    // Chest Oni Crest (Glows brighter with red intensity)
    ctx.fillStyle = '#ff003c';
    ctx.fillRect(-8, -10, 16, 6 + intensity * 2);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-10, -38, 20, 14);
    ctx.beginPath();
    ctx.moveTo(-10, -38);
    ctx.lineTo(-18 - intensity * 4, -50 - intensity * 6);
    ctx.lineTo(-4, -38);
    ctx.fillStyle = '#ff003c';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(10, -38);
    ctx.lineTo(18 + intensity * 4, -50 - intensity * 6);
    ctx.lineTo(4, -38);
    ctx.fill();

    ctx.fillStyle = '#ff003c';
    ctx.fillRect(samurai.facing === 1 ? 2 : -8, -32, 6, 3);

    // Katana Blade
    if (samurai.slashTimer > 0) {
      const bladeLen = 60 + intensity * 20;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3 + intensity * 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -5);
      ctx.lineTo(samurai.slashDir * bladeLen, -20);
      ctx.stroke();

      ctx.strokeStyle = '#ff003c';
      ctx.lineWidth = 2 + intensity * 2;
      ctx.beginPath();
      ctx.moveTo(0, -5);
      ctx.lineTo(samurai.slashDir * (bladeLen + 6), -20);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#c9d1d9';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(samurai.facing * -5, 10);
      ctx.lineTo(samurai.facing * 20, -10);
      ctx.stroke();
    }

    ctx.restore();

    // Draw Slash Arcs (Massive fiery crimson arcs as intensity climbs)
    for (const a of slashArcs) {
      ctx.save();
      const arcAlpha = (a.life / 11) * (0.6 + intensity * 0.4);
      ctx.strokeStyle = `rgba(255, 0, 60, ${arcAlpha})`;
      ctx.lineWidth = 4 + intensity * 4;
      ctx.beginPath();
      ctx.arc(a.x, a.y, 48 + intensity * 12, a.dir === 1 ? -0.8 : 2.3, a.dir === 1 ? 0.8 : 3.9);
      ctx.stroke();
      ctx.restore();
    }

    // Draw Particles
    for (const p of particles) {
      ctx.fillStyle = p.color;
      if (p.isBit) {
        ctx.font = '10px Consolas';
        ctx.fillText(p.char, p.x, p.y);
      } else {
        ctx.fillRect(p.x, p.y, 2.5 + intensity * 1.5, 2.5 + intensity * 1.5);
      }
    }

    // Floating Texts
    for (const ft of floatTexts) {
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 12.5px Consolas';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
    }

    // Dynamic Crimson Screen Edge Vignette as difficulty increases
    if (intensity > 0.05) {
      const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 180, canvas.width/2, canvas.height/2, 420);
      grad.addColorStop(0, 'rgba(255, 0, 60, 0)');
      grad.addColorStop(1, `rgba(255, 0, 60, ${intensity * 0.35})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Level Up Banner Overlay
    if (levelBannerTimer > 0) {
      ctx.fillStyle = 'rgba(255, 0, 60, 0.22)';
      ctx.fillRect(0, 130, canvas.width, 50);
      ctx.strokeStyle = '#ff003c';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(0, 130, canvas.width, 50);
      
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px Consolas';
      ctx.textAlign = 'center';
      ctx.fillText(levelBannerText, canvas.width / 2, 162);
    }

    // CRT Scanlines
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    for (let y = 0; y < canvas.height; y += 4) {
      ctx.fillRect(0, y, canvas.width, 1.5);
    }

    // Start Screen
    if (!gameStarted && !gameOver) {
      ctx.fillStyle = 'rgba(5, 7, 12, 0.82)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px Consolas';
      ctx.textAlign = 'center';
      ctx.fillText('SHOGUN: KATANA REFLEX SLASHER', canvas.width / 2, 155);
      
      ctx.fillStyle = '#ff003c';
      ctx.font = '13px Consolas';
      ctx.fillText('EASY START ➔ RED GLOW & SPEED INTENSIFIES OVER TIME', canvas.width / 2, 190);
      
      ctx.fillStyle = '#00ff66';
      ctx.font = 'bold 14px Consolas';
      ctx.fillText('[ PRESS A / D, ARROWS OR CLICK BUTTONS TO START ]', canvas.width / 2, 235);
    }

    // Game Over Screen
    if (gameOver) {
      ctx.fillStyle = 'rgba(5, 7, 12, 0.88)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = '#ff003c';
      ctx.font = 'bold 24px Consolas';
      ctx.textAlign = 'center';
      ctx.fillText('PACKET DESYNC // GAME OVER', canvas.width / 2, 140);
      
      ctx.fillStyle = '#ffffff';
      ctx.font = '15px Consolas';
      ctx.fillText('FINAL SCORE: ' + score + ' PTS  |  MAX COMBO: ' + maxCombo + 'x', canvas.width / 2, 180);
      
      ctx.fillStyle = '#8b949e';
      ctx.font = '12px Consolas';
      ctx.fillText('REACHED: ' + levelVal.textContent, canvas.width / 2, 205);

      ctx.fillStyle = '#00ff66';
      ctx.font = 'bold 14px Consolas';
      ctx.fillText('[ PRESS SPACE OR CLICK ANYWHERE TO RESTART ]', canvas.width / 2, 245);
    }

    ctx.restore();
  }

  update();
</script>

</body>
</html>
