<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakura Road · Emirhan Ünal</title>
<meta name="description" content="A tiny pixel art game about Emirhan Ünal's game development career: five stages under the cherry trees.">
<meta name="theme-color" content="#0b0814">
<style>
  :root { --bg: #0b0814; --panel: #160f22; --line: #3a2a4a; --pink: #f390b2; --pale: #ffd6e3; --gold: #fff3a6; --dim: #9a88ad; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--pale); font: 15px/1.5 ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; }
  body { min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 32px; gap: 16px; -webkit-tap-highlight-color: transparent; }
  header { text-align: center; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 0.12em; color: var(--gold); }
  header p { margin: 4px 0 0; color: var(--dim); font-size: 13px; }
  .stage { position: relative; padding: 6px; background: var(--panel); border: 2px solid var(--line); box-shadow: 0 0 0 2px #000, 0 12px 40px #0008; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: pointer; }
  canvas:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  .keys { color: var(--dim); font-size: 13px; text-align: center; }
  kbd { display: inline-block; min-width: 22px; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 4px; color: var(--pale); background: var(--panel); font: inherit; font-size: 12px; }
  .pad { display: none; width: 100%; max-width: 520px; justify-content: space-between; user-select: none; -webkit-user-select: none; }
  .pad div { display: flex; gap: 12px; }
  .pad button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); color: var(--pale); font: inherit; font-size: 20px; touch-action: none; }
  .pad button.on { background: var(--line); border-color: var(--pink); }
  .pad button.act { color: var(--gold); }
  @media (pointer: coarse) { .pad { display: flex; } .keys { display: none; } }
  nav { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; }
  nav a { color: var(--pink); text-decoration: none; border-bottom: 1px dashed var(--line); }
  nav a:hover, nav a:focus-visible { color: var(--gold); border-color: var(--gold); outline: none; }
  footer { color: var(--dim); font-size: 12px; text-align: center; max-width: 560px; }
  footer a { color: var(--dim); }
  noscript { color: var(--gold); }
</style>
</head>
<body>
  <header>
    <h1>SAKURA ROAD</h1>
    <p>Five stages of a game dev career, under the cherry trees.</p>
  </header>

  <div class="stage"><canvas id="screen" width="320" height="144" tabindex="0" aria-label="Sakura Road game screen. Arrow keys to move, up or space to jump, X to slash."></canvas></div>
  <noscript>This game needs JavaScript. The story is also in the <a href="https://github.com/benemirhanunal">GitHub profile</a>.</noscript>

  <p class="keys"><kbd>←</kbd> <kbd>→</kbd> move &nbsp; <kbd>↑</kbd> / <kbd>Space</kbd> jump &nbsp; <kbd>X</kbd> slash &nbsp; <kbd>Enter</kbd> start</p>
  <div class="pad" aria-hidden="true">
    <div><button data-key="L">◀</button><button data-key="R">▶</button></div>
    <div><button data-key="A" class="act">⚔</button><button data-key="J">▲</button></div>
  </div>

  <nav>
    <a href="https://store.steampowered.com/app/3989920/TaterUp/">TaterUp on Steam</a>
    <a href="https://icarusogt.itch.io/">itch.io</a>
    <a href="https://www.linkedin.com/in/benemirhanunal/">LinkedIn</a>
    <a href="https://github.com/benemirhanunal">GitHub</a>
    <a href="mailto:emirhan_60unal@hotmail.com">Email</a>
  </nav>

  <footer>Every pixel is drawn in code each frame, effects by <a href="https://github.com/patch-gg/pixelfx">pixelfx</a> (MIT).</footer>

<script>
  // integer scale when there's room, a clean fit on small screens
  const cv = document.getElementById("screen");
  function fit() {
    const avail = Math.min(innerWidth - 48, 1280), maxH = innerHeight * 0.62;
    let k = Math.floor(Math.min(avail / 320, maxH / 144));
    if (k < 2) k = Math.max(0.5, Math.min(avail / 320, maxH / 144));
    cv.style.width = 320 * k + "px"; cv.style.height = 144 * k + "px";
  }
  addEventListener("resize", fit); fit();
  cv.focus({ preventScroll: true });
</script>
<script type="module" src="game/main.js"></script>
</body>
</html>
